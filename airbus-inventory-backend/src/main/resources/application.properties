spring.application.name=airbus-inventory-backend
server.port=8080

# --- Database ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/airbus_inventory?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:airbus_app}
spring.datasource.password=${DB_PASSWORD:airbus_app_pw}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Run schema.sql / data.sql against MySQL on every startup (JdbcTemplate only, no JPA/Hibernate involved)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# --- JWT ---
# Secret must be overridden via env var / external config in any real deployment.
# A default is provided here only so the local demo runs out of the box.
jwt.secret=${JWT_SECRET:c2VjdXJlLWRlbW8tb25seS1zZWNyZXQta2V5LWRvLW5vdC11c2UtaW4tcHJvZC1haXJidXMtaW52ZW50b3J5LWFwcA==}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# --- CORS ---
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}

# --- Misc ---
spring.jackson.default-property-inclusion=non_null
logging.level.com.airbus.inventory=INFO
