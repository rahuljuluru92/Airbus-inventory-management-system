services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_pw_local_only
      MYSQL_DATABASE: airbus_inventory
      MYSQL_USER: airbus_app
      MYSQL_PASSWORD: airbus_app_pw
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./airbus-inventory-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/airbus_inventory?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: airbus_app
      DB_PASSWORD: airbus_app_pw
      CORS_ALLOWED_ORIGIN: http://localhost:4200
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./airbus-inventory-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mysql_data:
