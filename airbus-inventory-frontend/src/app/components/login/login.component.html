<div class="login-wrapper d-flex align-items-center justify-content-center">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Airbus Inventory</mat-card-title>
      <mat-card-subtitle>Sign in to manage aircraft parts inventory</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" autocomplete="username" data-testid="username-input" />
          <mat-error *ngIf="form.get('username')?.hasError('required')">Username is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Password</mat-label>
          <input
            matInput
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            autocomplete="current-password"
            data-testid="password-input"
          />
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="hidePassword = !hidePassword"
            [attr.aria-label]="'Toggle password visibility'"
          >
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="form.get('password')?.hasError('required')">Password is required</mat-error>
        </mat-form-field>

        <div class="alert alert-danger py-2" *ngIf="errorMessage">{{ errorMessage }}</div>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="w-100"
          [disabled]="submitting"
          data-testid="login-submit"
        >
          {{ submitting ? 'Signing in...' : 'Sign in' }}
        </button>
      </form>

      <p class="demo-hint mt-3 mb-0">
        Demo accounts: <code>admin / admin123</code> or <code>manager / manager123</code>
      </p>
    </mat-card-content>
  </mat-card>
</div>
